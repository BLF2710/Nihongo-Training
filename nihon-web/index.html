<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingora</title>
    <!-- Applies the saved or system theme before the first paint, so dark mode never flashes white. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || ((theme === null || theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (error) { /* storage unavailable: the light theme stays */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
